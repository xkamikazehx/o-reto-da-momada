<style>
:root {
  --azul:#1769aa;
  --fondo:#101522;
  --panel:#1b2435;
  --texto:#f5f7fb;
  --suave:#b8c3d4;
  --borde:#344158;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:24px 14px;
  background:radial-gradient(circle at top,#253653 0%,var(--fondo) 55%);
  color:var(--texto);font-family:Arial,Helvetica,sans-serif;
}
.container{width:100%;max-width:680px;margin:0 auto}
header{text-align:center;margin:15px 0 25px}
.subtitulo{color:#9dbce0;font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(30px,7vw,48px);line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:1px}
.acento{color:#65b5ff}
.panel{background:rgba(27,36,53,.96);border:1px solid var(--borde);border-radius:20px;padding:25px;box-shadow:0 16px 45px rgba(0,0,0,.25)}
.pantalla{display:none}
.pantalla.activa{display:block}
h2{margin-top:0;font-size:25px}
p{color:var(--suave);line-height:1.55}
.idiomas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:15px 17px;font-weight:bold;transition:.15s}
button:active{transform:scale(.98)}
.idioma-azul{background:var(--azul);color:white}
.idioma-branco{background:white;color:var(--azul);border:2px solid var(--azul)}
.botao-principal{width:100%;background:var(--azul);color:white;margin-top:15px}
.botao-principal:hover,.idioma-azul:hover{background:#104d80}
.botao-secundario{width:100%;background:white;color:var(--azul);margin-top:10px}
input{width:100%;background:#101827;color:white;border:1px solid #52617a;border-radius:10px;padding:15px;font-size:16px;margin-top:8px;outline:none}
input:focus{border-color:#65b5ff}
label{display:block;color:var(--suave);margin-top:20px;font-size:14px}
.info{display:flex;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.info-caixa{flex:1;min-width:100px;background:#111b2b;border:1px solid var(--borde);border-radius:12px;padding:12px;text-align:center}
.info-caixa small{display:block;color:var(--suave);font-size:12px;margin-bottom:5px}
.info-caixa strong{font-size:20px}
.barra-fondo{width:100%;height:8px;background:#101827;border-radius:20px;overflow:hidden;margin:12px 0 24px}
.barra{width:0%;height:100%;background:#55aaff;transition:width .25s}
.pregunta-numero{color:#75baff;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:1px}
#textoPregunta{font-size:22px;line-height:1.35;margin:12px 0 22px}
.respostas{display:grid;gap:11px}
.resposta{width:100%;text-align:left;background:#253248;color:white;border:1px solid #40516c;padding:16px;line-height:1.4}
.resposta:hover:not(:disabled){background:#304563;border-color:#75baff}
.resposta:disabled{cursor:default;opacity:1}
.resposta.correcta{background:#155b43;border-color:#35c58a}
.resposta.incorrecta{background:#702d3b;border-color:#ed7184}
#mensaxeResposta{min-height:25px;margin-top:15px;font-weight:bold}
.ranking-lista{margin-top:20px;display:grid;gap:9px}
.ranking-item{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:13px;border-radius:12px;background:#111b2b;border:1px solid var(--borde)}
.ranking-item.top1{border-color:#d7aa32;background:rgba(245,197,66,.12)}
.ranking-item.top2{border-color:#b8c3d4;background:rgba(184,195,212,.10)}
.ranking-item.top3{border-color:#bd8055;background:rgba(189,128,85,.10)}
.medalla{font-size:25px;text-align:center}
.nome-ranking{font-weight:bold;overflow-wrap:anywhere}
.detalle-ranking{color:var(--suave);font-size:12px;margin-top:4px}
.puntuacion{text-align:right;font-weight:bold;white-space:nowrap}
.mensaxe-vacia{text-align:center;padding:20px;color:var(--suave)}
.nota{text-align:center;color:#65b5ff;font-size:14px;font-weight:bold;margin-top:20px;line-height:1.5}
.separador{height:1px;background:var(--borde);margin:22px 0}
.centrado{text-align:center}
@media(max-width:480px){
  body{padding:12px 10px}
  .panel{padding:19px}
  .ranking-item{grid-template-columns:34px 1fr auto}
  #textoPregunta{font-size:20px}
}

/* AJUSTES PARA MÓVILES: ASPECTO DE APLICACIÓN */

body {

body:has(#pantallaConcurso.activa) header,
body:has(#pantallaConcurso.activa) .nota {

}

body:has(#pantallaConcurso.activa) .panel {

}

body:has(#pantallaConcurso.activa) .info {

body:has(#pantallaConcurso.activa) .info-caixa {

body:has(#pantallaConcurso.activa) .info-caixa strong {

body:has(#pantallaConcurso.activa) .barra-fondo {

body:has(#pantallaConcurso.activa) #textoPregunta {

  body {

  }

  }

  #textoPregunta {

  }
}


</style>

// MEZCLAR ELEMENTOS DE UN ARRAY
function mezclarArray(array) {
  const copia = [...array];

  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }

  return copia;
}

}

function mostrarPantalla(id) {
  document.querySelectorAll(".pantalla").forEach(p => {
    p.classList.remove("activa");
  });
  document.getElementById(id).classList.add("activa");
}

function formatarTempo(valor) {
  const minutos = Math.floor(valor / 60);
  const segundosRestantes = valor % 60;
  return String(minutos).padStart(2,"0") + ":" +
    String(segundosRestantes).padStart(2,"0");
}

// COMENZAR: MEZCLAR LAS 10 PREGUNTAS
function comezarConcurso() {
  const nome = document.getElementById("nomeParticipante").value.trim();

  if (!nome) {
    alert(textos[idioma].erroNome);
    return;
  }

  participante = nome;
  preguntaActual = 0;
  aciertos = 0;
  segundos = 0;

  // Cada partida tendrá un orden diferente de preguntas
  preguntasMezcladas = mezclarArray(preguntas);

  clearInterval(intervalo);

  document.getElementById("contadorAciertos").textContent = "0";
  document.getElementById("cronometro").textContent = "00:00";

  mostrarPantalla("pantallaConcurso");
  cargarPregunta();

  intervalo = setInterval(() => {
    segundos++;
    document.getElementById("cronometro").textContent = formatarTempo(segundos);
  },1000);
}

// CARGAR PREGUNTA Y MEZCLAR SUS RESPUESTAS
function cargarPregunta() {
  respostaSeleccionada = false;

  // Usar el orden aleatorio de preguntas de esta partida
  const p = preguntasMezcladas[preguntaActual];
  const t = textos[idioma];

  document.getElementById("textoPregunta").textContent = p[idioma];

  document.getElementById("barraProgreso").style.width =
    (preguntaActual / preguntasMezcladas.length * 100) + "%";

  document.getElementById("mensaxeResposta").textContent = "";

  const lista = document.getElementById("listaRespostas");
  lista.innerHTML = "";

  const opciones = idioma === "gl" ? p.opcionesGl : p.opcionesEs;

  // Asociar cada respuesta con su condición de correcta
  const respuestasMezcladas = opciones.map((texto, indice) => ({
    texto,
    esCorrecta: indice === p.correcta
  }));

  // Mezclar las cuatro respuestas
  const opcionesAleatorias = mezclarArray(respuestasMezcladas);

  opcionesAleatorias.forEach((respuesta, indice) => {
    const boton = document.createElement("button");

    boton.className = "resposta";
    boton.textContent = String.fromCharCode(65 + indice) + ". " + respuesta.texto;
    boton.dataset.correcta = respuesta.esCorrecta ? "true" : "false";
    boton.onclick = () => responder(boton);

    lista.appendChild(boton);
  });
}

function responder(botonElixido) {
  if (respostaSeleccionada) return;

  respostaSeleccionada = true;

  const t = textos[idioma];
  const botones = document.querySelectorAll(".resposta");
  const esCorrecta = botonElixido.dataset.correcta === "true";

  botones.forEach(boton => {
    boton.disabled = true;
    if (boton.dataset.correcta === "true") {
      boton.classList.add("correcta");
    }
  });

  const mensaxe = document.getElementById("mensaxeResposta");

  if (esCorrecta) {
    aciertos++;
    document.getElementById("contadorAciertos").textContent = aciertos;
    mensaxe.textContent = "✓ " + t.correcta;
    mensaxe.style.color = "#55d6a5";
  } else {
    botonElixido.classList.add("incorrecta");
    mensaxe.textContent = "✕ " + t.incorrecta;
    mensaxe.style.color = "#ff8b9b";
  }

  document.getElementById("barraProgreso").style.width =
    ((preguntaActual + 1) / preguntasMezcladas.length * 100) + "%";

  setTimeout(() => {
    seguintePregunta();
  },900);
}

function seguintePregunta() {
  preguntaActual++;

  if (preguntaActual >= preguntasMezcladas.length) {
    rematarConcurso();
    return;
  }

  cargarPregunta();
}

async function rematarConcurso() {
  clearInterval(intervalo);

  mostrarPantalla("pantallaResultado");

  const t = textos[idioma];

  document.getElementById("tituloResultado").textContent = t.resultado;
  document.getElementById("textoResultado").textContent = t.resultadoTexto;
  document.getElementById("resultadoAciertos").textContent = aciertos + "/10";
  document.getElementById("resultadoTempo").textContent = formatarTempo(segundos);
  document.getElementById("estadoGardado").textContent = t.gardando;

  const { error } = await supabaseClient
    .from("participantes")
    .insert([{
      nombre: participante,
      aciertos: aciertos,
      tiempo_segundos: segundos
    }]);

  if (error) {
    console.error("Erro ao gardar:",error);
    document.getElementById("estadoGardado").textContent = t.erroGardado;
  } else {
    document.getElementById("estadoGardado").textContent = t.gardado;
  }
}

async function verRanking() {
  mostrarPantalla("pantallaRanking");
  await cargarRanking();
}

function escaparHTML(valor) {
  return String(valor).replace(/[&<>"']/g, caracter => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[caracter]);
}

async function cargarRanking() {
  const lista = document.getElementById("rankingLista");
  const t = textos[idioma];

  lista.innerHTML = '<div class="mensaxe-vacia">...</div>';

  const { data,error } = await supabaseClient
    .from("participantes")
    .select("nombre, aciertos, tiempo_segundos, fecha")
    .order("aciertos",{ascending:false})
    .order("tiempo_segundos",{ascending:true})
    .order("fecha",{ascending:true})
    .limit(100);

  if (error) {
    console.error("Erro ao cargar ranking:",error);
    lista.innerHTML = '<div class="mensaxe-vacia">' +
      escaparHTML(t.erroConexion) + '</div>';
    return;
  }

  if (!data || data.length === 0) {
    lista.innerHTML = '<div class="mensaxe-vacia">' +
      escaparHTML(t.baleiro) + '</div>';
    return;
  }

  lista.innerHTML = data.map((persoa,indice) => {
    let medalla = String(indice + 1);
    let clase = "";

    if (indice === 0) {
      medalla = "🥇";
      clase = "top1";
    } else if (indice === 1) {
      medalla = "🥈";
      clase = "top2";
    } else if (indice === 2) {
      medalla = "🥉";
      clase = "top3";
    }

    return `
      <div class="ranking-item ${clase}">
        <div class="medalla">${medalla}</div>
        <div>
          <div class="nome-ranking">${escaparHTML(persoa.nombre)}</div>
          <div class="detalle-ranking">
            ${persoa.aciertos} ${escaparHTML(t.puntos)}
          </div>
        </div>
        <div class="puntuacion">${formatarTempo(persoa.tiempo_segundos)}</div>
      </div>
    `;
  }).join("");
}

function xogarOutraVez() {
  document.getElementById("nomeParticipante").value = participante;
  mostrarPantalla("pantallaBenvida");
}

actualizarTextos();
</script>
